name: Format Check

on:
  push:
  pull_request:
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install clang-format
        run: pip install clang-format==13.0.1

      - name: Check formatting
        # The vendored Bosch BME69x Sensor API is kept unmodified and is not formatted.
        run: find components \( -name "*.cpp" -o -name "*.h" \) -not -name "bme69x*" | xargs clang-format --dry-run --Werror
