# Parallel mode: the gas sensor sweeps through a heater profile while
# temperature, pressure and humidity are measured continuously. Every profile
# step can publish its own gas resistance, `gas_resistance` holds the last
# valid reading of the sweep.

esphome:
  name: bme690-parallel-mode

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../components
    components: [bme690]

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: bme690
    address: 0x76
    update_interval: 10s
    operation_mode: parallel
    temperature:
      name: "BME690 Temperature"
    pressure:
      name: "BME690 Pressure"
    humidity:
      name: "BME690 Humidity"
    gas_resistance:
      name: "BME690 Gas Resistance"
    heater:
      # Duration of a single profile step. The time the temperature, pressure
      # and humidity measurement takes is subtracted from it automatically to
      # get the shared heater duration.
      shared_duration: 140ms
      profile:
        - temperature: 320
          multiplier: 5
          gas_resistance:
            name: "BME690 Gas Resistance 320 °C"
        - temperature: 100
          multiplier: 2
        - temperature: 100
          multiplier: 10
        - temperature: 100
          multiplier: 30
          gas_resistance:
            name: "BME690 Gas Resistance 100 °C"
        - temperature: 200
          multiplier: 5
        - temperature: 200
          multiplier: 5
        - temperature: 200
          multiplier: 5
          gas_resistance:
            name: "BME690 Gas Resistance 200 °C"
        - temperature: 320
          multiplier: 5
        - temperature: 320
          multiplier: 5
        - temperature: 320
          multiplier: 5
