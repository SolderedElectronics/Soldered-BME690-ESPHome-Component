# Sequential mode: the sensor steps through the heater profile on its own,
# sleeping for the `odr` duration between two measurements. Every profile step
# can publish its own gas resistance, `gas_resistance` holds the last valid
# reading of the sweep.

esphome:
  name: bme690-sequential-mode

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../components
    components: [bme690]

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: bme690
    address: 0x76
    update_interval: 10s
    operation_mode: sequential
    # Sleep duration between two measurements of the profile.
    odr: 250ms
    temperature:
      name: "BME690 Temperature"
    pressure:
      name: "BME690 Pressure"
    humidity:
      name: "BME690 Humidity"
    gas_resistance:
      name: "BME690 Gas Resistance"
    heater:
      profile:
        - temperature: 320
          duration: 150ms
          gas_resistance:
            name: "BME690 Gas Resistance 320 °C"
        - temperature: 100
          duration: 150ms
        - temperature: 100
          duration: 150ms
        - temperature: 100
          duration: 150ms
          gas_resistance:
            name: "BME690 Gas Resistance 100 °C"
        - temperature: 200
          duration: 150ms
        - temperature: 200
          duration: 150ms
        - temperature: 200
          duration: 150ms
          gas_resistance:
            name: "BME690 Gas Resistance 200 °C"
        - temperature: 320
          duration: 150ms
        - temperature: 320
          duration: 150ms
        - temperature: 320
          duration: 150ms
